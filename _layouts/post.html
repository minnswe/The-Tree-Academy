<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | The Tree Institute</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">

            <a class="navbar-brand" href="{{ '/' | relative_url }}">
                The Tree Institute
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/' | relative_url }}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/about.html' | relative_url }}">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/blog.html' | relative_url }}">
                            Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ '/contact.html' | relative_url }}">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <main class="container py-5">

        <article>

            <h1>{{ page.title }}</h1>

            <p class="text-muted">
                {{ page.date | date: "%B %-d, %Y" }}
            </p>

            <hr>

            {{ content }}

        </article>

    </main>


    <footer class="text-center py-4 bg-light">

        <p class="mb-1">
            © 2026 The Tree Institute
        </p>

        <p class="mb-0">
            For Ten Thousand Birds
        </p>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
